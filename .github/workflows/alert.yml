name: NAS100 Alert Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_run_weekend:
        description: 'Bypass weekend check (testing only)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          SYMBOL_ID_NAS100: ${{ secrets.CTRADER_SYMBOL_ID_NAS100 }}
          SYMBOL_ID_XAUUSD: ${{ secrets.CTRADER_SYMBOL_ID_XAUUSD }}
          SYMBOL_ID_EURUSD: ${{ secrets.CTRADER_SYMBOL_ID_EURUSD }}
          GH_PAT_FOR_SECRETS: ${{ secrets.GH_PAT_FOR_SECRETS }}
          FORCE_RUN_WEEKEND: ${{ github.event.inputs.force_run_weekend }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "nas100-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if [ -f alerts_log.json ]; then git add alerts_log.json; fi
          if [ -f live_setups.json ]; then git add live_setups.json; fi
          git diff --cached --quiet || git commit -m "Update alert state [skip ci]"
          git push

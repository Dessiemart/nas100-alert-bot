name: NAS100 Alert Bot

on:
  schedule:
    # Every 15 minutes - Twelve Data's free tier is credit-limited, so
    # we check less often than the old cTrader version did.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit state.json back

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "nas100-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if [ -f alerts_log.json ]; then git add alerts_log.json; fi
          git diff --cached --quiet || git commit -m "Update alert state [skip ci]"
          git push

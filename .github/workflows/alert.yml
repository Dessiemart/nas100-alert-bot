name: NAS100 Alert Bot

on:
  schedule:
    # Every 5 minutes. GitHub's scheduler can lag a few minutes under
    # load - fine for an alert-only system that isn't auto-trading.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit state.json back

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_IS_LIVE: ${{ secrets.CTRADER_IS_LIVE }}
          SYMBOL_ID_NAS100: ${{ secrets.SYMBOL_ID_NAS100 }}
          SYMBOL_ID_XAUUSD: ${{ secrets.SYMBOL_ID_XAUUSD }}
          SYMBOL_ID_EURUSD: ${{ secrets.SYMBOL_ID_EURUSD }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "nas100-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update alert state [skip ci]"
          git push

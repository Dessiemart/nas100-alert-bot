name: Secret Scan (one-off history check)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks over entire git history
        id: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          chmod +x gitleaks
          set +e
          ./gitleaks detect --source . --log-opts="--all" --report-format json --report-path findings.json --no-banner
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Write mobile-friendly summary
        if: always()
        run: |
          echo "## Secret Scan Result" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.gitleaks.outputs.exit_code }}" = "0" ]; then
            echo "✅ No secrets found in git history. Clean." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Potential secrets found — see details below. ROTATE anything real before doing anything else." >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat findings.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no findings.json produced)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
